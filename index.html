const B={keys:[],err:0,streak:0,fired:false,last:0};

function features(){const k=B.keys,n=k.length||1,bs=k.filter(x=>x.k==="b").length/n;
 let fast=0;for(let i=1;i<k.length;i++)if(k[i].t-k[i-1].t<70)fast++;
 return {bs,fast:fast/n,streak:B.streak,total:B.err}}
